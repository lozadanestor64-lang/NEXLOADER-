
name: NexLoader APK Builder

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build NexLoader APK
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Preparar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Instalar componentes Android
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Preparar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Encontrar proyecto Android
        shell: bash
        run: |
          SETTINGS_FILE=$(find . -type f \
            -path '*/android/settings.gradle' \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            SETTINGS_FILE=$(find . -type f \
              -path '*/android/settings.gradle.kts' \
              -print -quit)
          fi

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: No se encontro android/settings.gradle"
            echo "Archivos y carpetas disponibles:"
            find . -maxdepth 4 -type f | head -100
            exit 1
          fi

          ANDROID_DIR=$(dirname "$SETTINGS_FILE")

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

          echo "Proyecto encontrado: $ANDROID_DIR"

          test -f "$ANDROID_DIR/build.gradle" || \
          test -f "$ANDROID_DIR/build.gradle.kts"

          test -f "$ANDROID_DIR/app/build.gradle" || \
          test -f "$ANDROID_DIR/app/build.gradle.kts"

      - name: Verificar herramientas
        run: |
          java -version
          gradle --version
          sdkmanager --version

      - name: Compilar NexLoader
        run: |
          gradle -p "$ANDROID_DIR" \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Verificar APK
        run: |
          APK="$ANDROID_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: No se genero el APK"
            find "$ANDROID_DIR" -name "*.apk"
            exit 1
          fi

          ls -lh "$APK"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: NexLoader-APK
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
